<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1110" viewBox="0 0 1260 1110" role="img" aria-labelledby="t"><title id="t">Confluence and Jira product lifecycle with planning, work, and outcome layers</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#71869A"/></marker></defs><rect width="1260" height="1110" rx="16" fill="#F5F8FC"/><text x="36" y="47" fill="#102D46" font-family="Arial,sans-serif" font-size="26" font-weight="700">The complete Promisory product lifecycle</text><text x="36" y="76" fill="#4B6177" font-family="Arial,sans-serif" font-size="14" font-weight="400">Confluence carries intent and evidence. Jira carries work. Promisory connects the agreements.</text><text x="36" y="121" fill="#4B6177" font-family="Arial,sans-serif" font-size="11" font-weight="700">DIRECTION AND CONTEXT ABOVE EPICS</text><rect x="36" y="138" width="368" height="84" rx="12" fill="#EBF4FC" stroke="#CFDBE6"/><text x="54" y="168" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Vision, objectives, and key results</text><text x="54" y="192" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Confluence strategy / supported goal reference</text><rect x="446" y="138" width="368" height="84" rx="12" fill="#EBF4FC" stroke="#CFDBE6"/><text x="464" y="168" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Portfolio, program, product, initiative</text><text x="464" y="192" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Planning links or configured native Jira levels</text><rect x="856" y="138" width="368" height="84" rx="12" fill="#EBF4FC" stroke="#CFDBE6"/><text x="874" y="168" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Opportunity and requirements</text><text x="874" y="192" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Discovery / PRD / reviewed acceptance</text><line x1="406" y1="180" x2="444" y2="180" stroke="#71869A" stroke-width="2" marker-end="url(#a)"/><line x1="816" y1="180" x2="854" y2="180" stroke="#71869A" stroke-width="2" marker-end="url(#a)"/><text x="36" y="270" fill="#4B6177" font-family="Arial,sans-serif" font-size="11" font-weight="700">LIFECYCLE PHASES AND THEIR CONFLUENCE ARTIFACTS</text><rect x="36" y="287" width="224" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="54" y="317" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">01 · Strategy</text><text x="54" y="341" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Vision / goals / measures</text><rect x="277" y="287" width="224" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="295" y="317" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">02 · Discovery</text><text x="295" y="341" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Research / assumptions</text><rect x="518" y="287" width="224" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="536" y="317" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">03 · Initiative</text><text x="536" y="341" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Charter / business case</text><rect x="759" y="287" width="224" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="777" y="317" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">04 · Definition</text><text x="777" y="341" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">PRD / design / decisions</text><rect x="1000" y="287" width="224" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="1018" y="317" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">05 · Planning</text><text x="1018" y="341" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Roadmap / epic / story map</text><rect x="36" y="393" width="224" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="54" y="423" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">06 · Delivery</text><text x="54" y="447" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Sprint notes / decisions</text><rect x="277" y="393" width="224" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="295" y="423" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">07 · Validation</text><text x="295" y="447" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Tests / UAT / readiness</text><rect x="518" y="393" width="224" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="536" y="423" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">08 · Release</text><text x="536" y="447" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Rollout / launch / adoption</text><rect x="759" y="393" width="224" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="777" y="423" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">09 · Operate and learn</text><text x="777" y="447" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Runbook / outcome / retro</text><rect x="1000" y="393" width="224" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="1018" y="423" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">10 · Evolve or retire</text><text x="1018" y="447" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Migration / deprecation</text><text x="36" y="528" fill="#4B6177" font-family="Arial,sans-serif" font-size="13" font-weight="400">Phases can overlap and repeat. Readiness reflects versioned evidence, not a forced waterfall.</text><rect x="36" y="561" width="1188" height="177" rx="14" fill="#102D46"/><text x="60" y="592" fill="#C6DCEE" font-family="Arial,sans-serif" font-size="11" font-weight="700">JIRA DELIVERY STRUCTURE</text><text x="60" y="630" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="22" font-weight="700">Configured higher levels → Epic → Story / Task / Bug → Subtask</text><text x="60" y="667" fill="#D5E5F1" font-family="Arial,sans-serif" font-size="14" font-weight="400">Project is a container. Stories, tasks, and bugs share the standard-work level.</text><text x="60" y="699" fill="#D5E5F1" font-family="Arial,sans-serif" font-size="13" font-weight="400">Implementation, blocking, sprint, release, requirement, and evidence links have their own types.</text><text x="36" y="780" fill="#4B6177" font-family="Arial,sans-serif" font-size="11" font-weight="700">DISTINCT CHECKS BEFORE CALLING AN OUTCOME COMPLETE</text><rect x="36" y="801" width="368" height="142" rx="12" fill="#EBF4FC" stroke="#CFDBE6"/><text x="54" y="831" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Readiness</text><text x="54" y="855" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Is the evidence current?</text><text x="54" y="886" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Required artifacts and acceptance.</text><text x="54" y="909" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Exact versions and named reviewers.</text><rect x="446" y="801" width="368" height="142" rx="12" fill="#EBF4FC" stroke="#CFDBE6"/><text x="464" y="831" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Execution authority</text><text x="464" y="855" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">May this exact action proceed?</text><text x="464" y="886" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Verified Decionis / AgentSafe path.</text><text x="464" y="909" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">A gate does not issue permission.</text><rect x="856" y="801" width="368" height="142" rx="12" fill="#EBF4FC" stroke="#CFDBE6"/><text x="874" y="831" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Verified outcome</text><text x="874" y="855" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Did the agreement hold?</text><text x="874" y="886" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Actual delivery and business evidence.</text><text x="874" y="909" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Adoption is measured separately.</text><text x="36" y="990" fill="#102D46" font-family="Arial,sans-serif" font-size="18" font-weight="700">Learning creates the next owner-confirmed commitment.</text><text x="36" y="1020" fill="#4B6177" font-family="Arial,sans-serif" font-size="13" font-weight="400">A reopened bug or changed PRD can surface impact across the entire chain, within the viewer’s access.</text><text x="36" y="1078" fill="#4B6177" font-family="Arial,sans-serif" font-size="11" font-weight="400">Proposed product model · explicit mappings and permission-aware evidence · not all links are native graph API relationships</text></svg>