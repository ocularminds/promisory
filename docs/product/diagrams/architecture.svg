<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="680" viewBox="0 0 1260 680" role="img" aria-labelledby="t"><title id="t">Promisory architecture and authority boundaries</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#71869A"/></marker></defs><rect width="1260" height="680" rx="16" fill="#F5F8FC"/><text x="36" y="48" fill="#102D46" font-family="Arial,sans-serif" font-size="26" font-weight="700">Promisory architecture</text><text x="36" y="74" fill="#4B6177" font-family="Arial,sans-serif" font-size="14" font-weight="400">Graph context stays in Atlassian. A separately configured path controls an exact external action.</text><rect x="24" y="98" width="774" height="530" rx="15" fill="#EBF4FC" stroke="#CFDBE6"/><rect x="832" y="98" width="404" height="530" rx="15" fill="#FFF4EC" stroke="#D7C5B8"/><text x="45" y="130" fill="#102D46" font-family="Arial,sans-serif" font-size="12" font-weight="700">ATLASSIAN / FORGE</text><text x="854" y="130" fill="#102D46" font-family="Arial,sans-serif" font-size="12" font-weight="700">CONFIGURED EXTERNAL AUTHORITY PATH</text><rect x="46" y="156" width="344" height="82" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="64" y="186" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Jira + connected Confluence</text><text x="64" y="210" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Work, pages, and current user permissions</text><rect x="430" y="156" width="344" height="82" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="448" y="186" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Rovo + optional Atlassian MCP</text><text x="448" y="210" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Shared retrieval and proposal tools</text><rect x="235" y="290" width="344" height="88" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="253" y="320" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Promisory domain / Forge UI</text><text x="253" y="344" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Commitments, impact, reviews, verification</text><rect x="46" y="450" width="344" height="82" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="64" y="480" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Teamwork Graph</text><text x="64" y="504" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Permission-filtered context; no graph egress</text><rect x="430" y="450" width="344" height="82" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="448" y="480" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Forge storage</text><text x="448" y="504" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Scoped records and recoverable operations</text><line x1="218" y1="238" x2="315" y2="288" stroke="#71869A" stroke-width="2" marker-end="url(#a)"/><line x1="600" y1="238" x2="500" y2="288" stroke="#71869A" stroke-width="2" marker-end="url(#a)"/><line x1="315" y1="378" x2="220" y2="448" stroke="#71869A" stroke-width="2" marker-end="url(#a)"/><line x1="500" y1="378" x2="600" y2="448" stroke="#71869A" stroke-width="2" marker-end="url(#a)"/><rect x="858" y="178" width="352" height="82" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="876" y="208" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Verified remote adapter</text><text x="876" y="232" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Independent permitted action intent</text><rect x="858" y="324" width="352" height="82" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="876" y="354" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">AgentSafe</text><text x="876" y="378" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Exact request enforcement and relay</text><rect x="858" y="472" width="352" height="82" rx="12" fill="#FFFFFF" stroke="#CFDBE6"/><text x="876" y="502" fill="#102D46" font-family="Arial,sans-serif" font-size="16" font-weight="700">Decionis</text><text x="876" y="526" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Policy, grant lifecycle, signed decision</text><line x1="579" y1="327" x2="855" y2="219" stroke="#71869A" stroke-width="2" marker-end="url(#a)"/><text x="652" y="264" fill="#4B6177" font-family="Arial,sans-serif" font-size="11" font-weight="400">Verified invocation</text><line x1="1033" y1="260" x2="1033" y2="322" stroke="#71869A" stroke-width="2" marker-end="url(#a)"/><text x="1045" y="294" fill="#4B6177" font-family="Arial,sans-serif" font-size="11" font-weight="400">Allowed target only</text><line x1="1033" y1="406" x2="1033" y2="470" stroke="#71869A" stroke-width="2" marker-end="url(#a)"/><text x="1044" y="446" fill="#4B6177" font-family="Arial,sans-serif" font-size="11" font-weight="400">Evaluate / claim / finalize</text><text x="50" y="580" fill="#4B6177" font-family="Arial,sans-serif" font-size="13" font-weight="400">External action receipts return for reconciliation and outcome verification.</text><text x="50" y="603" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Native Jira activity outside this path remains governed by Jira permissions.</text><text x="858" y="594" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Authorized relay → Atlassian REST → read-back</text><text x="36" y="658" fill="#4B6177" font-family="Arial,sans-serif" font-size="11" font-weight="400">Proposed architecture · not a live deployment diagram</text></svg>