t="700">Separate relationships:</text><text x="40" y="994" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">native parent / planning / defines / implements</text><text x="40" y="1017" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">blocks / supports / owns / verifies</text><text x="36" y="1111" fill="#4B6177" font-family="Arial,sans-serif" font-size="12" font-weight="400">Illustrative records · no live tenant configuration implied · a Confluence page tree is not Jira ancestry</text></svg>